[package]
name = "mapcast"
version = "0.6.2"
edition = "2021"
description = "MapCast companion: reads the addon's strip from the WoW window and serves the live map to phones"
publish = false

[[bin]]
name = "mapcast"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
base64 = "0.22"
flate2 = "1"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "tga", "jpeg"] }
log = "0.4"
md-5 = "0.10"
mlua = { version = "0.10", features = ["luajit", "vendored"] }
qrcode = { version = "0.14", default-features = false }
rayon = "1"
serde_json = "1"
sha1_smol = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
webp = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
